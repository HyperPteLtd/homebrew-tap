name: Update Hyper VPN cask

on:
  schedule:
    # Match Homebrew/homebrew-cask's official autobump schedule.
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hyper-vpn-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Check out main
        run: |
          git fetch origin main
          git switch --force-create main origin/main

      - name: Update cask metadata
        id: update
        run: ruby scripts/update-cask.rb --github-output "$GITHUB_OUTPUT"

      - name: Download updated DMG
        if: steps.update.outputs.updated == 'true'
        env:
          DOWNLOAD_URL: ${{ steps.update.outputs.url }}
        run: curl --fail --location --retry 3 --retry-all-errors --output "$RUNNER_TEMP/hyper-vpn.dmg" "$DOWNLOAD_URL"

      - name: Verify updated DMG
        if: steps.update.outputs.updated == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.update.outputs.version }}
          EXPECTED_SHA256: ${{ steps.update.outputs.sha }}
        run: ruby scripts/verify-dmg.rb --dmg "$RUNNER_TEMP/hyper-vpn.dmg" --version "$EXPECTED_VERSION" --sha256 "$EXPECTED_SHA256"

      - name: Run tests
        if: steps.update.outputs.updated == 'true'
        run: ruby -Itest -e 'Dir["test/*_test.rb"].sort.each { |file| load file }'

      - name: Check cask style
        if: steps.update.outputs.updated == 'true'
        run: brew style --cask HyperPteLtd/tap/hyper-vpn

      - name: Audit cask
        if: steps.update.outputs.updated == 'true'
        run: brew audit --cask --new --online HyperPteLtd/tap/hyper-vpn

      - name: Check latest version
        if: steps.update.outputs.updated == 'true'
        run: brew livecheck --cask HyperPteLtd/tap/hyper-vpn

      - name: Commit and push update
        if: steps.update.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          git diff --check
          test "$(git diff --name-only)" = "Casks/hyper-vpn.rb"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/hyper-vpn.rb
          git commit -m "hyper-vpn $VERSION"
          git push origin HEAD:main

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Prepare test-bot
        run: |
          brew test-bot --only-cleanup-before
          brew test-bot --only-setup

      - name: Check tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Test changed casks
        if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae

      - name: Run updater and verifier tests
        run: ruby -Itest -e 'Dir["test/*_test.rb"].sort.each { |file| load file }'

      - name: Check Ruby syntax
        run: |
          ruby -c scripts/update-cask.rb
          ruby -c scripts/verify-dmg.rb
          ruby -c Casks/hyper-vpn.rb

      - name: Check repository style
        run: |
          brew style Casks/hyper-vpn.rb scripts/update-cask.rb scripts/verify-dmg.rb \
            test/update_cask_test.rb test/verify_dmg_test.rb

      - name: Audit cask
        run: brew audit --cask --new --online HyperPteLtd/tap/hyper-vpn

      - name: Check latest version
        run: brew livecheck --cask HyperPteLtd/tap/hyper-vpn
